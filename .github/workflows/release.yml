name: C÷ release and packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag to publish (for example v0.2.0)"
        required: true
        default: "v0.2.0"
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cdivide-linux-x64.tar.gz
          - os: windows-latest
            asset_name: cdivide-windows-x64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install into package directory
        run: cmake --install build --prefix package --config Release
      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset_name }}" -C package .
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "${{ matrix.asset_name }}"
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum cdivide-* > SHA256SUMS
      - name: Create release and attach packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: C÷ ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*

  publish-container:
    name: Publish GitHub Container package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish C÷ compiler image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/c-divide:${{ inputs.tag_name || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/c-divide:latest
