name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cdivide-linux-x64.tar.gz
          - os: windows-latest
            asset_name: cdivide-windows-x64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install into package directory
        run: cmake --install build --prefix package --config Release
      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset_name }}" -C package .
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "${{ matrix.asset_name }}"
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and attach packages
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
