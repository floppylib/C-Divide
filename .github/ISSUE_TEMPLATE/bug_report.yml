name: Bug report
description: Report a reproducible problem in the C÷ compiler or documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve C÷. Please avoid posting secrets or private information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: C÷ version or commit
      placeholder: "main / commit hash / version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a small .cdiv example and the command you ran.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      render: text
    validations:
      required: false
