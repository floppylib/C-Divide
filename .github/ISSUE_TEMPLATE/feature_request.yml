name: Feature idea
description: Suggest a language, compiler, or tooling improvement.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the use case, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: Show a small C÷ example if this changes the language.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs or alternatives
      description: Optional notes about complexity, performance, or other approaches.
    validations:
      required: false
